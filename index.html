<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Schülerbuch">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#7b2d5b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Schülerbuch</title>
<style>
:root{
  /* Layout: schmale Kopfzeile, Inhalt max. 960px, feste Tab-Leiste unten (iPad-typisch). Listen aus Zeilen mit großen Tippflächen. */
  --bg:#f3f4f7; --surface:#ffffff; --ink:#1b2130; --muted:#5d6576; --line:#dde1e8;
  --accent:#7b2d5b; --accent-ink:#ffffff; --accent-soft:#f5e8f0;
  --good:#2b7a4b; --good-soft:#e3f3e9; --warn:#9a5b06; --warn-soft:#fcf1dc; --bad:#b0271d; --bad-soft:#fce8e6;
  --font-display:ui-serif,"New York",Georgia,"Times New Roman",serif;
  --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(20,24,40,.05),0 6px 18px rgba(20,24,40,.06);
  --avl:88%; --avd:28%; --avs:42%;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121419; --surface:#1c1f27; --ink:#e8ebf1; --muted:#a2aaba; --line:#2d323e;
    --accent:#e48dc0; --accent-ink:#2a0f1f; --accent-soft:#3a2332;
    --good:#6fc892; --good-soft:#1d3527; --warn:#f0b75c; --warn-soft:#3a2d16; --bad:#ff8e84; --bad-soft:#3d1f1d;
    --shadow:0 1px 2px rgba(0,0,0,.3); --avl:26%; --avd:86%; --avs:32%;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121419; --surface:#1c1f27; --ink:#e8ebf1; --muted:#a2aaba; --line:#2d323e;
  --accent:#e48dc0; --accent-ink:#2a0f1f; --accent-soft:#3a2332;
  --good:#6fc892; --good-soft:#1d3527; --warn:#f0b75c; --warn-soft:#3a2d16; --bad:#ff8e84; --bad-soft:#3d1f1d;
  --shadow:0 1px 2px rgba(0,0,0,.3); --avl:26%; --avd:86%; --avs:32%;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}.notes{margin-top:8px;display:flex;flex-direction:column;gap:4px}.nline{display:grid;grid-template-columns:110px 1fr;gap:8px;font-size:15px}.nlab{color:var(--muted,#6b6b76);font-size:14px;white-space:nowrap}.nval{white-space:pre-wrap}.yhead{padding:8px 16px;font-weight:700;font-size:14px;letter-spacing:.06em;color:var(--muted,#6b6b76);background:var(--soft,#f4eef2)}.rep summary{padding:12px 16px;cursor:pointer;list-style:none}.rep summary::-webkit-details-marker{display:none}.replist{display:flex;flex-direction:column;border-top:1px solid var(--line,#e5e5ea)}.reprow{display:flex;justify-content:space-between;gap:12px;padding:10px 16px;border:0;border-top:1px solid var(--line,#e5e5ea);background:none;font:inherit;text-align:left;cursor:pointer;color:inherit}.reprow:first-child{border-top:0}.prevnote{background:var(--soft,#f4eef2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}@media(max-width:520px){.nline{grid-template-columns:1fr;gap:0}}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--font-display);font-size:30px;font-weight:600;letter-spacing:-.01em}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
h3{font-size:18px}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.18em}
#app{min-height:100%;padding:calc(env(safe-area-inset-top) + 14px) max(16px,env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
#main{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:6px}
.phead .eyebrow{margin:0 0 2px;color:var(--muted);font-size:15px}
.banner{border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.banner.info{background:var(--accent-soft)}
.banner.warn{background:var(--warn-soft);color:var(--ink)}
.banner.bad{background:var(--bad-soft)}
.banner p{margin:0;flex:1 1 260px}
section.block{display:flex;flex-direction:column;gap:10px}
.bhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.card.pad{padding:14px 16px}
.list>*+*{border-top:1px solid var(--line)}
.none{color:var(--muted);margin:0;padding:14px 16px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:9px 14px;min-height:42px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.danger{color:var(--bad);border-color:var(--line)}
.btn.sm{min-height:36px;padding:6px 10px;font-size:15px}
.btn:focus-visible,.act:focus-visible,.lrow:focus-visible,.srow:focus-visible,.tab:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
/* Stunden-Zeile */
.lrow{display:grid;grid-template-columns:62px 42px 1fr auto;gap:12px;align-items:center;padding:11px 14px;cursor:pointer;min-height:64px}
.lrow:active{background:var(--accent-soft)}
.ltime{display:flex;flex-direction:column;font-variant-numeric:tabular-nums;line-height:1.15}
.ltime b{font-size:17px}
.ltime small{color:var(--muted);font-size:13px}
.lname{font-weight:700}
.lmain{min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:13px;line-height:1;padding:5px 8px;border-radius:99px;background:var(--bg);color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.good{background:var(--good-soft);color:var(--good)}
.lright{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.act{border:0;border-radius:10px;padding:8px 12px;min-height:42px;display:inline-flex;gap:6px;align-items:center;font-weight:700;cursor:pointer}
.act.ok{background:var(--good-soft);color:var(--good)}
.act.no{background:var(--bg);color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:700;padding:6px 10px;border-radius:99px}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--bg);color:var(--muted)}
.st-abgesagt .lname{text-decoration:line-through;text-decoration-color:var(--muted)}
.st-gehalten{background:linear-gradient(90deg,var(--good-soft) 0 4px,transparent 4px)}
.st-abgesagt{background:linear-gradient(90deg,var(--bad-soft) 0 4px,transparent 4px)}
/* Avatar */
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;background:hsl(var(--h) var(--avs) var(--avl));color:hsl(var(--h) 50% var(--avd));flex:none;letter-spacing:.02em}
.av.lg{width:72px;height:72px;font-size:24px}
img.av{object-fit:cover;display:block;background:var(--line)}
/* Wochenplan */
.weeknav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.weeknav .jump{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted,#666);margin-left:4px}.weeknav .jump .inp{width:auto;padding:6px 8px;min-height:0}.weeknav .title{font-weight:700;min-width:190px;text-align:center;font-variant-numeric:tabular-nums}
.day{display:flex;flex-direction:column;gap:8px}
.dhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.dhead h3 span{color:var(--muted);font-weight:400}
.day.today .dhead h3{color:var(--accent)}
.day.today .dhead h3::after{content:"heute";font-size:12px;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:3px 8px;margin-left:8px;vertical-align:3px}
.freebar{background:repeating-linear-gradient(135deg,var(--bg) 0 8px,var(--surface) 8px 16px);border:1px dashed var(--line);border-radius:var(--r);padding:10px 14px;color:var(--muted);font-weight:600}
.erow{display:flex;gap:12px;align-items:center;padding:11px 14px;cursor:pointer}
.ebadge{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.erow .meta{color:var(--muted);font-size:15px}
/* Schülerliste */
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-weight:600;cursor:pointer;min-height:38px}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fchip .n{opacity:.65;margin-left:4px;font-variant-numeric:tabular-nums}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px}
.srow{display:flex;gap:12px;align-items:center;padding:11px 14px;cursor:pointer;min-height:64px}
.srow .grow{flex:1;min-width:0}
.srow .sub{color:var(--muted);font-size:15px}
.srow .end{display:flex;gap:6px;align-items:center}
/* Detail */
.dtop{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.dtop .grow{flex:1;min-width:200px}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));margin:0 -1px -1px 0}
.facts>div{padding:12px 16px;box-shadow:inset -1px -1px 0 var(--line)}
.facts dt{color:var(--muted);font-size:14px}
.facts dd{margin:2px 0 0;font-weight:600}
.punch{display:flex;gap:7px;flex-wrap:wrap;margin:6px 0}
.punch span{width:34px;height:34px;border-radius:50%;border:2px solid var(--accent)}
.punch span.used,.punch button.used{background:var(--accent)}.punch{gap:6px 4px}.slot{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:52px}.slot small{font-size:12px;color:var(--muted);min-height:15px;font-variant-numeric:tabular-nums}.punch span,.punch button{display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--accent)}.punch span.used,.punch button.used{color:#fff}.dlink{border:0;background:none;padding:0;font:inherit;color:inherit;text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer}.cdates{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.5}.punch button{width:34px;height:34px;border-radius:50%;border:2px solid var(--accent);background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}.punch button.next{border-style:dashed;border-width:3px;animation:pulse 1.8s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.12)}}.punch.empty button.used{background:var(--bad);border-color:var(--bad)}@media(prefers-reduced-motion:reduce){.punch button.next{animation:none}}
.punch.empty span{border-color:var(--bad)}
.punch.empty span.used{background:var(--bad)}
.big{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;padding:14px 16px}
.mbtn{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:8px;min-height:54px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;font-weight:600}
.mbtn small{font-weight:400;color:var(--muted);font-size:12px}
.mbtn.paid{background:var(--good-soft);border-color:transparent;color:var(--good)}
.mbtn.paid small{color:var(--good)}
.mbtn.skip{background:var(--bg);color:var(--muted);border-style:dashed}
.check{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;background:var(--surface);cursor:pointer;padding:0}
.check.on{background:var(--good);border-color:var(--good);color:#fff}
.remrow{display:flex;gap:12px;align-items:center;padding:10px 14px}
.remrow .grow{flex:1;min-width:0}
.remrow.done .txt{text-decoration:line-through;color:var(--muted)}
.paytable .prow{display:grid;grid-template-columns:42px 1fr auto auto;gap:12px;align-items:center;padding:10px 14px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.sum .card{padding:14px 16px}
.sum .lbl{color:var(--muted);font-size:14px}
/* Tab-Leiste */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px max(8px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));z-index:20}
nav.tabs .in{display:flex;max-width:960px;width:100%;justify-content:space-around}
.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;border-radius:10px;min-width:0}
.tab .ic{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}
.tab .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
/* Sheet */
#sheet{position:fixed;inset:0;z-index:50;display:none;background:rgba(10,12,20,.45);align-items:flex-end;justify-content:center}
#sheet.open{display:flex}
@media (min-width:700px){#sheet{align-items:center}}
.panel{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px;-webkit-overflow-scrolling:touch}
@media (min-width:700px){.panel{border-radius:20px;max-height:88%}}
.panel .ph{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.panel .ph .sub{color:var(--muted);font-size:15px;margin-top:2px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lbl{font-weight:700;font-size:15px}
.field .hint{color:var(--muted);font-size:14px;margin:0}
.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:11px;padding:10px 12px;min-height:44px}
textarea.inp{min-height:96px;resize:vertical}
.inp:focus{outline:2px solid var(--accent);outline-offset:0;background:var(--surface)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg label{flex:1;position:relative;min-width:84px}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{display:block;text-align:center;padding:9px 8px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg input:checked+span{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg input:focus-visible+span{outline:2px solid var(--accent)}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.cbtn{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-weight:600;cursor:pointer}
.cbtn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.slotrow{display:grid;grid-template-columns:1.3fr 1fr 1.2fr 1.3fr auto;gap:6px;align-items:end}
@media (max-width:560px){.slotrow{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}
.slotrow .mini{font-size:13px;color:var(--muted);display:block;margin-bottom:3px}
.cbline{display:flex;gap:10px;align-items:center;padding:6px 0;cursor:pointer}
.cbline input{width:22px;height:22px;accent-color:var(--accent)}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:2px 12px;max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:11px;padding:6px 10px}
.foot{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom));background:var(--surface);padding:12px 0 4px;margin-bottom:-4px;border-top:1px solid var(--line)}
.foot .r{display:flex;gap:8px;margin-left:auto}
details.more summary{cursor:pointer;color:var(--accent);font-weight:600;padding:4px 0}
details.more[open] summary{margin-bottom:10px}
.info{background:var(--bg);border-radius:11px;padding:10px 12px;font-size:15px}
.xbtn{border:0;background:var(--bg);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px 10px 16px;display:flex;gap:12px;align-items:center;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
#toast button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:8px;padding:5px 10px;font-weight:700;cursor:pointer}
.settings-row{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:8px;align-items:center;padding:8px 14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:center;padding:12px 16px}
.welcome{padding:22px;display:flex;flex-direction:column;gap:12px}
.welcome h2{font-family:var(--font-display);text-transform:none;letter-spacing:0;font-size:24px;color:var(--ink);font-weight:600}
.welcome p{margin:0;max-width:60ch}
.staff{height:22px;background:repeating-linear-gradient(180deg,var(--line) 0 1px,transparent 1px 5px);opacity:.9;border-radius:2px;margin-top:4px}
/* Statistik */
.bars{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;align-items:end}
.bar{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.bv{height:120px;width:100%;max-width:34px;background:var(--bg);border-radius:6px;display:flex;align-items:flex-end;overflow:hidden}
.bv span{display:block;width:100%;background:var(--accent);border-radius:6px 6px 0 0}
.bl{font-size:12px;color:var(--muted)}
.bn{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;min-height:14px;color:var(--ink)}
@media (max-width:700px){.bn{font-size:9.5px;letter-spacing:-.02em}.bl{font-size:10.5px}.bars{gap:3px}}
/* Jahresplan */
.ymonth{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:start;padding:6px 0;border-top:1px solid var(--line)}
.ymonth:first-child{border-top:0}
.ymlbl{color:var(--muted);font-weight:700;font-size:14px;padding-top:9px}
.ydays{display:flex;flex-wrap:wrap;gap:6px}
.yday{min-width:52px;min-height:42px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 8px;font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.yday small{font-size:10.5px;font-weight:600;color:var(--accent);max-width:92px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.yday.sugg{border:2px dashed var(--accent)}
.yday.struck{background:var(--bad-soft);border-color:transparent;color:var(--bad);text-decoration:line-through}
.yday.struck small{color:var(--bad)}
/* Bedingungen (Papier) */
.paper{background:#fffdfb;color:#1b2130;border-radius:6px;box-shadow:var(--shadow);padding:36px 40px;max-width:760px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.ptop{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap}
.pkicker{color:#7b2d5b;font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.ptitle{font-family:var(--font-display);font-size:32px;color:#1b2130;text-transform:none;letter-spacing:-.01em;font-weight:700}
.psender{color:#5d6576;font-size:14px;text-align:right}

<script>
"use strict";
/* ================= Hilfsfunktionen ================= */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>Array.from(el.querySelectorAll(s));
const h=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d,12)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const todayStr=()=>ymd(new Date());
const wd=s=>{const g=parse(s).getDay();return g===0?7:g};
const mondayOf=s=>addDays(s,1-wd(s));
const daysBetween=(a,b)=>Math.round((parse(b)-parse(a))/86400000);
const WD=["","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
const WDS=["","Mo","Di","Mi","Do","Fr","Sa","So"];

const MONS=["Jan.","Feb.","März","Apr.","Mai","Juni","Juli","Aug.","Sep.","Okt.","Nov.","Dez."];
const fmtD=s=>{if(!s)return"";const d=parse(s);return `${d.getDate()}.${d.getMonth()+1}.${d.getFullYear()}`};
const fmtDs=s=>{const d=parse(s);return `${d.getDate()}.${d.getMonth()+1}.`};
const fmtDm=s=>{const d=parse(s);return `${d.getDate()}. ${MONS[d.getMonth()]}`};
const fmtLong=s=>{const d=parse(s);return `${WD[wd(s)]}, ${d.getDate()}. ${MON[d.getMonth()]} ${d.getFullYear()}`};
const ym=s=>s.slice(0,7);
const fmtYM=m=>`${MON[+m.slice(5)-1]} ${m.slice(0,4)}`;
const fmtYMs=m=>`${MONS[+m.slice(5)-1]} ${m.slice(2,4)}`;
const addMonths=(m,n)=>{let y=+m.slice(0,4),mo=+m.slice(5)-1+n;y+=Math.floor(mo/12);mo=((mo%12)+12)%12;return `${y}-${pad(mo+1)}`};
const euro=n=>(n===""||n==null||isNaN(n))?"–":Number(n).toLocaleString("de-DE",{minimumFractionDigits:Number(n)%1?2:0,maximumFractionDigits:2})+" €";
function isoWeek(s){const d=parse(s);d.setDate(d.getDate()+3-((d.getDay()+6)%7));const w1=new Date(d.getFullYear(),0,4,12);return 1+Math.round(((d-w1)/86400000-3+((w1.getDay()+6)%7))/7)}
const hueOf=s=>{let x=0;for(const c of String(s))x=(x*31+c.charCodeAt(0))>>>0;return x%360};
const initials=n=>{const p=String(n||"?").replace(/^Beispiel:\s*/,"").trim().split(/\s+/);return((p[0]||"?")[0]+(p.length>1?p[p.length-1][0]:"")).toUpperCase()};
const byName=(a,b)=>a.name.localeCompare(b.name,"de",{sensitivity:"base"});
const num=v=>{if(v===""||v==null)return null;const n=Number(String(v).replace(",","."));return isNaN(n)?null:n};

};

/* ================= Feiertage & Ferien (Hessen) ================= */
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),hh=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-hh-k)%7,m=Math.floor((a+11*hh+22*l)/451),mo=Math.floor((hh+l-7*m+114)/31),da=((hh+l-7*m+114)%31)+1;return ymd(new Date(y,mo-1,da,12))}
const HOL={};
function holidays(y){if(HOL[y])return HOL[y];const e=easter(y),m={};m[`${y}-01-01`]="Neujahr";m[addDays(e,-2)]="Karfreitag";m[addDays(e,1)]="Ostermontag";m[`${y}-05-01`]="Tag der Arbeit";m[addDays(e,39)]="Christi Himmelfahrt";m[addDays(e,50)]="Pfingstmontag";m[addDays(e,60)]="Fronleichnam";m[`${y}-10-03`]="Tag der Deutschen Einheit";m[`${y}-12-25`]="1. Weihnachtstag";m[`${y}-12-26`]="2. Weihnachtstag";return HOL[y]=m}
const DEFAULT_FREE=[
 {id:"f26o",name:"Osterferien",from:"2026-03-30",to:"2026-04-10"},
 {id:"f26s",name:"Sommerferien",from:"2026-06-29",to:"2026-08-07"},
 {id:"f26h",name:"Herbstferien",from:"2026-10-05",to:"2026-10-17"},
 {id:"f26w",name:"Weihnachtsferien",from:"2026-12-23",to:"2027-01-12"},
 {id:"f27o",name:"Osterferien",from:"2027-03-22",to:"2027-04-02"},
 {id:"f27s",name:"Sommerferien",from:"2027-06-28",to:"2027-08-06"},
 {id:"f27h",name:"Herbstferien",from:"2027-10-04",to:"2027-10-16"},
 {id:"f27w",name:"Weihnachtsferien",from:"2027-12-23",to:"2028-01-11"},
 {id:"f28o",name:"Osterferien",from:"2028-04-03",to:"2028-04-14"},
 {id:"f28s",name:"Sommerferien",from:"2028-07-03",to:"2028-08-11"}
];
const DEFAULT_SETTINGS={free:DEFAULT_FREE,prices:{30:[65],45:[90,95],60:[120,125]},cardPrice:{10:380,5:210},singlePrice:45,warn:2,days:[1,2,3,4,5],yearTarget:36,struck:{},profile:{name:"",contact:"",bank:"",owner:"",iban:"",bic:""}};
function baseFree(s){const hol=holidays(+s.slice(0,4))[s];if(hol)return hol;for(const f of D.settings.free||[])if(f.from&&f.to&&s>=f.from&&s<=f.to)return f.name||"Unterrichtsfrei";return null}
function freeReason(s){return baseFree(s)||(D.settings.struck&&D.settings.struck[s]?"Unterrichtsfreier Tag (Jahresplan)":null)}

/* ================= Speicher (nur auf diesem Gerät) ================= */
const Store={mode:"mem",db:null,
 async open(){
  try{
   if(!("indexedDB" in window))throw new Error("kein IndexedDB");
   this.db=await new Promise((res,rej)=>{const r=indexedDB.open("schuelerbuch",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);setTimeout(()=>rej(new Error("timeout")),5000)});
   await this.get("state");this.mode="idb";
  }catch(e){
   try{localStorage.setItem("__sb","1");localStorage.removeItem("__sb");this.mode="ls"}catch(e2){this.mode="mem"}
  }
 },
 get(k){
  if(this.mode==="idb"||(this.db&&this.mode==="mem"))return new Promise((res,rej)=>{try{const q=this.db.transaction("kv","readonly").objectStore("kv").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}catch(e){rej(e)}});
  if(this.mode==="ls"){const v=localStorage.getItem("sb_"+k);return Promise.resolve(v?JSON.parse(v):undefined)}
  return Promise.resolve(undefined);
 },
 set(k,v){
  if(this.mode==="idb")return new Promise((res,rej)=>{try{const tx=this.db.transaction("kv","readwrite");tx.objectStore("kv").put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)}catch(e){rej(e)}});
  if(this.mode==="ls"){localStorage.setItem("sb_"+k,JSON.stringify(v));return Promise.resolve()}
  return Promise.resolve();
 }
};
function emptyData(){return{v:1,students:{},lessons:{},events:{},reminders:{},settings:JSON.parse(JSON.stringify(DEFAULT_SETTINGS)),meta:{created:todayStr(),lastBackup:null}}}
let D=emptyData();
let ver=0,saveTimer=null,saving=false,saveAgain=false;
function changed(){ver++;syncCards();ver++;render();clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,250)}
async function saveNow(){
 clearTimeout(saveTimer);
 if(saving){saveAgain=true;return}
 saving=true;
 try{await Store.set("state",JSON.parse(JSON.stringify(D)));if(S.saveErr){S.saveErr=null;render()}}
 catch(e){S.saveErr="Speichern hat nicht geklappt. Bitte sichere deine Daten und lade die App neu.";render()}
 saving=false;
 if(saveAgain){saveAgain=false;saveNow()}
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")saveNow()});
window.addEventListener("pagehide",()=>saveNow());
function normalize(d){
 const e=emptyData();const r=Object.assign(e,d||{});
 r.settings=Object.assign(JSON.parse(JSON.stringify(DEFAULT_SETTINGS)),r.settings||{});
 r.settings.profile=Object.assign(JSON.parse(JSON.stringify(DEFAULT_SETTINGS.profile)),r.settings.profile||{});
 if(!r.settings.struck||typeof r.settings.struck!=="object")r.settings.struck={};
 for(const k of ["students","lessons","events","reminders"])if(!r[k]||typeof r[k]!=="object")r[k]={};
 r.meta=Object.assign({created:todayStr(),lastBackup:null},r.meta||{});
 return r;
}

/* ================= Zustand der Oberfläche ================= */
const S={view:"home",arg:null,from:"home",week:wd(todayStr())===7?addDays(todayStr(),1):mondayOf(todayStr()),filter:"aktiv",search:"",payMonth:ym(todayStr()),showDoneRem:false,showPastEv:false,saveErr:null,ready:false,framed:false,persisted:null,planYear:null,termsFor:"",statYear:+todayStr().slice(0,4)};
try{S.framed=window.self!==window.top}catch(e){S.framed=true}
S.standalone=!!(navigator.standalone||(window.matchMedia&&matchMedia("(display-mode: standalone)").matches));
S.ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);

/* ================= Abgeleitete Daten ================= */
const memo={};
function cached(key,fn){const m=memo[key];if(m&&m.v===ver)return m.val;const val=fn();memo[key]={v:ver,val};return val}
const students=()=>cached("students",()=>Object.values(D.students).sort(byName));
const activeStudents=()=>students().filter(s=>s.status==="aktiv");
const VM={};
function lessonIdx(){return cached("lidx",()=>{const byDate={},bySid={};for(const l of Object.values(D.lessons)){(byDate[l.date]=byDate[l.date]||[]).push(l);(bySid[l.sid]=bySid[l.sid]||[]).push(l)}return{byDate,bySid}})}
function lessonsOn(d){return cached("lo"+d,()=>{
 const idx=lessonIdx();const res=(idx.byDate[d]||[]).filter(l=>D.students[l.sid]&&(l.status!=="offen"||D.students[l.sid].status==="aktiv"));
 if(!freeReason(d)){
  for(const st of activeStudents()){
   for(const sl of st.slots||[]){
    if(+sl.wd!==wd(d)||!sl.time)continue;
    const from=sl.from||st.start||"2000-01-01";if(d<from)continue;
    if(sl.rh==="2"&&(daysBetween(mondayOf(from),mondayOf(d))/7)%2!==0)continue;
    const id=`r_${st.id}_${d}_${sl.id}`;if(D.lessons[id])continue;
    const v={id,sid:st.id,date:d,time:sl.time,dur:st.dur,kind:"regel",status:"offen",virtual:true};VM[id]=v;res.push(v);
   }
  }
 }
 return res.sort((a,b)=>(a.time||"").localeCompare(b.time||""));
})}
const lessonById=id=>D.lessons[id]?Object.assign({},D.lessons[id]):(VM[id]?Object.assign({},VM[id]):null);
const cSize=c=>+c.size||10,cUses=c=>Array.isArray(c.uses)?c.uses:[];
function sortedCards(st){return(st.cards||[]).slice().sort((a,b)=>(a.bought||"").localeCompare(b.bought||""))}
function cardStats(st){
 const cards=sortedCards(st);const over=(st.overUses||[]).length;
 if(!cards.length)return{none:true,remaining:0,cards:[],over};
 const total=cards.reduce((n,c)=>n+cSize(c),0),usedC=cards.reduce((n,c)=>n+Math.min(cUses(c).length,cSize(c)),0);
 const current=cards.find(c=>cUses(c).length<cSize(c))||null;const last=cards[cards.length-1];
 return{cards,total,used:usedC+over,remaining:total-usedC-over,current,curUsed:current?cUses(current).length:0,over,last,expires:cardExpiry(current||last)};
}
const stampSort=(a,b)=>(a.date||"").localeCompare(b.date||"");
function addStamp(st,date,lid){const cards=sortedCards(st);
 const ex=[...cards.flatMap(cUses),...(st.overUses||[])].find(u=>!u.lid&&u.date===date);if(ex&&lid){ex.lid=lid;ex.auto=true;return}
 const u={date,lid:lid||null,auto:!!lid};
 const c=cards.find(c=>cUses(c).length<cSize(c)&&(!c.bought||!date||c.bought<=date))||cards.find(c=>cUses(c).length<cSize(c)&&!lid);
 if(c){c.uses=cUses(c);c.uses.push(u)}else{st.overUses=st.overUses||[];st.overUses.push(u)}}
let heldSeen=null;
function syncCards(){
 const held=new Set();for(const l of Object.values(D.lessons))if(l.status==="gehalten")held.add(l.id);
 for(const st of Object.values(D.students)){
  if(!(st.cards||[]).length&&!(st.overUses||[]).length&&st.billing!=="zehner")continue;
  // einmalige Umstellung: bisherige Zählung als Stunden ohne Datum übernehmen
  if((st.cards||[]).some(c=>!Array.isArray(c.uses))){const AL=cardAlloc(st);for(const c of st.cards){c.uses=(AL.per[c.id]||[]).map(()=>({date:null,lid:null}));delete c.preUsed}st.overUses=AL.over.map(()=>({date:null,lid:null}))}
  for(const c of st.cards||[])c.uses=cUses(c).filter(u=>!u.lid||held.has(u.lid));
  st.overUses=(st.overUses||[]).filter(u=>!u.lid||held.has(u.lid));
  for(const u of [...(st.cards||[]).flatMap(cUses),...st.overUses])if(u.lid&&u.auto){const L=D.lessons[u.lid];if(L&&L.date!==u.date)u.date=L.date}
  if(heldSeen&&st.billing==="zehner")for(const l of Object.values(D.lessons))if(l.sid===st.id&&l.status==="gehalten"&&!heldSeen.has(l.id)){const linked=[...(st.cards||[]).flatMap(cUses),...st.overUses].some(u=>u.lid===l.id);if(!linked)addStamp(st,l.date,l.id)}
  // Stunden ohne Karte in freie Karten übernehmen
  for(const c of sortedCards(st))while(st.overUses.length&&cUses(c).length<cSize(c)){c.uses=cUses(c);c.uses.push(st.overUses.shift())}
 }
 heldSeen=held;
}
function cardAlloc(st){
 const cards=(st.cards||[]).slice().sort((a,b)=>(a.bought||"").localeCompare(b.bought||""));const res={};for(const c of cards)res[c.id]=[];
 if(!cards.length)return{per:res,over:[]};
 const start=cards[0].bought||"2000-01-01";
 let held=(lessonIdx().bySid[st.id]||[]).filter(l=>l.status==="gehalten"&&l.date>=start).sort((a,b)=>(a.date+(a.time||"")).localeCompare(b.date+(b.time||"")));
 const neg=cards.reduce((s,c)=>s+Math.max(0,-(+c.preUsed||0)),0);held=held.slice(Math.min(neg,held.length));
 const ev=[];for(const c of cards){for(let i=0;i<Math.max(0,+c.preUsed||0);i++)ev.push({pre:true,cid:c.id,date:c.bought||"",k:0})}
 for(const l of held)ev.push({pre:false,date:l.date,time:l.time,id:l.id,k:1});
 ev.sort((a,b)=>a.date.localeCompare(b.date)||a.k-b.k);
 let i=0;for(const c of cards){const size=+c.size||10;while(res[c.id].length<size&&i<ev.length)res[c.id].push(ev[i++])}
 return{per:res,over:ev.slice(i)};
}
function cardExpiry(c){if(!c||!c.bought)return null;const d=parse(c.bought);d.setFullYear(d.getFullYear()+1);return addDays(ymd(d),-1)}
function pauseRanges(st){const r=(st.pauses||[]).slice();if(st.status==="pausiert"&&st.pauseFrom)r.push({from:st.pauseFrom,to:null});return r}
function monthPaused(st,m){return pauseRanges(st).some(p=>p.from&&ym(p.from)<=m&&(!p.to||m<ym(p.to)))}
function monthState(st,m){const v=(st.paid||{})[m];if(v==="x")return"entfaellt";if(v)return"bezahlt";if(monthPaused(st,m))return"pausiert";return"offen"}
const MSTATE={offen:"offen",bezahlt:"bezahlt",pausiert:"pausiert",entfaellt:"entfällt"};
const openRem=sid=>Object.values(D.reminders).filter(r=>!r.done&&(sid===undefined||r.sid===sid)).sort((a,b)=>(a.created||"").localeCompare(b.created||""));
function eventsOn(d){return cached("ev"+d,()=>Object.values(D.events).filter(e=>e.date===d).sort((a,b)=>(a.time||"").localeCompare(b.time||"")))}
function nextLessons(sid,n=3){const out=[];const t=todayStr();for(let i=0;i<70&&out.length<n;i++){const d=addDays(t,i);for(const l of lessonsOn(d))if(l.sid===sid&&l.status==="offen")out.push(l)}return out.slice(0,n)}
function pastOpen(){return cached("pastOpen",()=>{const t=todayStr(),out=[];for(let i=1;i<=42;i++){const d=addDays(t,-i);for(const l of lessonsOn(d))if(l.status==="offen")out.push(l)}return out})}
function backupDue(){const lb=D.meta.lastBackup;if(!students().length)return false;if(!lb)return true;return daysBetween(lb,todayStr())>=7}
const slotText=st=>(st.slots||[]).filter(s=>s.time).map(s=>`${WDS[s.wd]} ${s.time}${s.rh==="2"?" (14-tägig)":""}`).join(", ");
const BILL={durch:"Durchzahler",zehner:"Zehnerkarte",einzeln:"Einzelstunden",ms:"Musikschule",frei:"Kostenlos"};
const STAT={aktiv:"Aktiv",pausiert:"Pausiert",warteliste:"Warteliste",archiviert:"Archiviert"};

/* ================= Bausteine ================= */
const okPhoto=p=>typeof p==="string"&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(p);
const avatar=(st,c="")=>okPhoto(st.photo)?`<img class="av ${c}" src="${st.photo}" alt="" aria-hidden="true">`:`<div class="av ${c}" style="--h:${hueOf(st.name)}" aria-hidden="true">${h(initials(st.name))}</div>`;
function billChip(st){
 if(st.billing==="ms")return`<span class="chip acc">Musikschule</span>`;
 if(st.billing==="einzeln")return`<span class="chip">Einzelstunde</span>`;
 if(st.billing==="frei")return`<span class="chip">kostenlos</span>`;
 if(st.billing==="zehner"){const cs=cardStats(st);if(cs.none)return`<span class="chip bad">keine Karte</span>`;const r=cs.remaining;const cls=r<=0?"bad":r<=D.settings.warn?"warn":"";const sz=+((cs.current||cs.last).size)||10;return`<span class="chip ${cls}">${sz}er · ${r<=0?(r===0?"aufgebraucht":`${-r} offen`):`noch ${r}`}</span>`}
 return`<span class="chip">Durchzahler</span>`;
}
function lessonRow(l,showDate){
 const st=D.students[l.sid];if(!st)return"";if(l.virtual)VM[l.id]=l;
 const chips=[`<span class="chip">${h(l.dur||st.dur||"")}′</span>`,billChip(st)];
 if(st.kind==="gruppe")chips.push(`<span class="chip acc">2er-Gruppe</span>`);
 if(l.kind==="nachhol")chips.push(`<span class="chip acc">Nachholstunde</span>`);
 if(l.kind==="einzel")chips.push(`<span class="chip">Einzeltermin</span>`);
 const rc=openRem(st.id).length;if(rc)chips.push(`<span class="chip warn">${icon("bell")} ${rc}</span>`);
 if(l.note)chips.push(`<span class="chip">${icon("text")} Notiz</span>`);
 if(st.billing==="einzeln"&&l.status==="gehalten")chips.push(l.paid?`<span class="chip good">bezahlt</span>`:`<span class="chip warn">${euro(st.price)} offen</span>`);
 if(l.status==="abgesagt"&&l.nachholen&&!l.nachholId)chips.push(`<span class="chip warn">nachholen</span>`);
 const right=l.status==="offen"
  ?`<button class="act ok" data-act="held" data-id="${h(l.id)}">${icon("check")}<span>Gehalten</span></button><button class="act no" data-act="cancel" data-id="${h(l.id)}">Absagen</button>`
  :l.status==="gehalten"?`<span class="pill good">${icon("check")} gehalten</span>`

  ${avatar(st)}<div class="lmain"><div class="lname">${h(st.name)}</div><div class="chips">${chips.join("")}</div></div>

}

VIEWS.plan=()=>{

VIEWS.students=()=>{
 const all=students();const cnt=f=>all.filter(s=>inFilter(s,f)).length;
 const F=[["aktiv","Aktiv"],["privat","Privat"],["zehner","Zehnerkarte"],["ms","Musikschule"],["pausiert","Pausiert"],["warteliste","Warteliste"],["archiviert","Archiv"],["alle","Alle"]];
 return`<header class="phead"><div><p class="eyebrow">${cnt("aktiv")} aktive Schüler</p><h1>Schüler</h1></div><button class="btn primary" data-act="newStudent">${icon("plus")} Neuer Schüler</button></header>
 ${topBanners()}
 <div class="filters" role="group" aria-label="Filter">${F.map(([k,l])=>`<button class="fchip" data-act="filter" data-f="${k}" aria-pressed="${S.filter===k}">${l}<span class="n">${cnt(k)}</span></button>`).join("")}</div>

function inFilter(s,f){if(f==="alle")return true;if(f==="ms")return s.billing==="ms"&&s.status==="aktiv";if(f==="privat")return s.billing!=="ms"&&s.status==="aktiv";if(f==="zehner")return s.billing==="zehner"&&s.status==="aktiv";return s.status===f}
function studentList(){
 const q=S.search.trim().toLowerCase();
 let L=students().filter(s=>inFilter(s,S.filter));
 if(q){const hit=s=>(s.name+" "+(s.members||[]).join(" ")).toLowerCase().includes(q);const act=L.filter(hit);const rest=students().filter(s=>hit(s)&&!act.includes(s));
  if(!act.length&&!rest.length)return`<div class="card"><p class="none">Niemand gefunden.</p></div>`;
  return (act.length?studentRows(act):"")+(rest.length?`<h2 style="margin:14px 0 8px">In anderen Listen gefunden</h2>${studentRows(rest)}`:"")}
 if(S.filter==="warteliste"&&!q)L.sort((a,b)=>(a.waitSince||"").localeCompare(b.waitSince||""));
 if(!L.length)return`<div class="card"><p class="none">${q?"Niemand gefunden.":S.filter==="warteliste"?"Die Warteliste ist leer.":S.filter==="pausiert"?"Gerade pausiert niemand.":S.filter==="archiviert"?"Im Archiv ist noch niemand.":"Noch keine Schüler in dieser Liste."}</p></div>`;

function studentRows(L){

  else if(s.status==="archiviert")sub=`Archiviert${s.archivedAt?` seit ${fmtD(s.archivedAt)}`:""}`;
  else if(s.status==="pausiert")sub=`Pausiert${s.pauseUntil?` bis ${fmtD(s.pauseUntil)}`:""}${s.pauseNote?` · ${h(s.pauseNote)}`:""}`;
  else sub=[s.kind==="gruppe"?"2er-Gruppe":"",slotText(s)||"kein fester Termin",`${s.dur}′`,s.billing==="durch"&&s.price!=null?`${euro(s.price)}/Monat`:s.billing==="einzeln"&&s.price!=null?`${euro(s.price)}/Stunde`:""].filter(Boolean).join(" · ");
  return`<div class="srow" data-act="student" data-id="${h(s.id)}" role="button" tabindex="0">${avatar(s)}<div class="grow"><div class="lname">${h(s.name)}</div><div class="sub">${sub}</div></div><div class="end">${s.status==="aktiv"?billChip(s):`<span class="chip">${STAT[s.status]}</span>`}${icon("right")}</div></div>`;
 }).join("")}</div>`;

 <div class="dtop">${avatar(st,"lg")}<div class="grow"><h1>${h(st.name)}</h1><div class="chips" style="margin-top:6px"><span class="chip ${st.status==="aktiv"?"good":st.status==="warteliste"||st.status==="pausiert"?"warn":""}">${STAT[st.status]}</span>${st.status==="aktiv"?billChip(st):""}<span class="chip">${st.dur}′</span></div></div>
 <div class="row-btns">${st.status==="pausiert"?`<button class="btn primary" data-act="reactivate" data-id="${h(st.id)}">${icon("check")} Wieder aktiv</button>`:""}${st.status==="warteliste"?`<button class="btn primary" data-act="takeIn" data-id="${h(st.id)}">${icon("check")} Aufnehmen</button>`:""}<button class="btn" data-act="editStudent" data-id="${h(st.id)}">${icon("pen")} Bearbeiten</button></div></div>`;

/* ================= Jahresplan ================= */
function defaultPlanYear(){const t=todayStr();return +t.slice(5,7)>=9?+t.slice(0,4)+1:+t.slice(0,4)}
function yearDays(y,w){return cached(`yd${y}_${w}`,()=>{const out=[];let d=`${y}-01-01`;while(d.startsWith(String(y))){if(wd(d)===w&&!baseFree(d))out.push(d);d=addDays(d,1)}return out})}
function yearStat(y,w){const days=yearDays(y,w);const struck=days.filter(d=>D.settings.struck[d]);const left=days.length-struck.length;return{days,struck,left,need:left-(+D.settings.yearTarget||36)}}
function suggestTag(d){const y=+d.slice(0,4),e=easter(y),hol=holidays(y);
 if(d===addDays(e,-52))return"Weiberfastnacht";if(d===addDays(e,-48))return"Rosenmontag";if(d===addDays(e,-47))return"Fastnacht";
 const w=wd(d);if(w===5&&hol[addDays(d,-1)])return"Brückentag";if(w===1&&hol[addDays(d,1)])return"Brückentag";return null}
VIEWS.year=()=>{
 const y=S.planYear,target=+D.settings.yearTarget||36;const W=(D.settings.days||[]).filter(d=>d<=5);
 let out=`<div><button class="btn ghost" data-act="nav" data-view="more">${icon("left")} Mehr</button></div>
 <header class="phead"><div><p class="eyebrow">${target} Stunden pro Wochentag für Durchzahler</p><h1>Jahresplan ${y}</h1></div>
  <div class="weeknav"><button class="btn" data-act="yearPrev" aria-label="Voriges Jahr">${icon("left")}</button><span class="title" style="min-width:70px">${y}</span><button class="btn" data-act="yearNext" aria-label="Nächstes Jahr">${icon("right")}</button></div></header>
 ${topBanners()}
 <div class="card pad" style="display:flex;flex-direction:column;gap:10px"><p style="margin:0">Ferien und Feiertage sind schon herausgerechnet. <b>Tippe einen Tag an, um ihn zu streichen</b> – gestrichene Tage sind für alle Schüler unterrichtsfrei und verschwinden aus dem Stundenplan. Nochmal tippen holt den Tag zurück.</p>
  <p class="muted" style="margin:0;font-size:15px">Gestrichelt umrandet: Vorschläge (Brückentage, Fasching).</p>
  <div class="row-btns"><button class="btn primary" data-act="autoPlan">${icon("star")} Vorschlag erstellen</button><button class="btn" data-act="freeDaysPdf">${icon("save")} Liste für Schüler (PDF)</button><button class="btn danger" data-act="resetYear">Streichungen ${y} zurücksetzen</button></div></div>`;
 for(const w of W){
  const s=yearStat(y,w);

 }

function autoPlan(){
 const y=S.planYear,target=+D.settings.yearTarget||36;let n=0;
 for(const w of (D.settings.days||[]).filter(d=>d<=5)){
  const s=yearStat(y,w);let need=s.need;if(need<=0)continue;
  const free=s.days.filter(d=>!D.settings.struck[d]);
  const pick=[...free.filter(d=>suggestTag(d)),...free.filter(d=>!suggestTag(d)).reverse()];

let pdfLoading=null;
function loadPdfLib(){if(window.jspdf)return Promise.resolve(window.jspdf);if(pdfLoading)return pdfLoading;pdfLoading=new Promise((res,rej)=>{const sc=document.createElement("script");sc.src="jspdf.umd.min.js";sc.onload=()=>res(window.jspdf);sc.onerror=()=>{pdfLoading=null;rej(new Error("PDF-Baustein fehlt"))};document.head.appendChild(sc)});return pdfLoading}
function pdfDoc(){
 const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:"mm",format:"a4"});
 const W=210,M=22,CW=W-2*M,ACC=[123,45,91],INK=[27,33,48],MUT=[93,101,118];let y=24;
 const api={doc,
  ensure(hh){if(y+hh>277){doc.addPage();y=24}},
  kicker(t){doc.setFont("helvetica","bold");doc.setFontSize(9);doc.setTextColor(...ACC);doc.text(t.toUpperCase(),M,y,{charSpace:.6});y+=7},
  title(t,right){doc.setFont("times","bold");doc.setFontSize(24);doc.setTextColor(...INK);doc.text(t,M,y);if(right){doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(...MUT);doc.text(doc.splitTextToSize(right,62),W-M,y-9,{align:"right"})}y+=5;
   doc.setDrawColor(...ACC);doc.setLineWidth(.25);for(let i=0;i<5;i++)doc.line(M,y+i*1.2,M+CW,y+i*1.2);y+=12},
  box(t){doc.setFont("helvetica","normal");doc.setFontSize(10.5);const L=doc.splitTextToSize(t,CW-10);const hh=L.length*5+6;api.ensure(hh+4);doc.setFillColor(245,232,240);doc.roundedRect(M,y-4.5,CW,hh,2,2,"F");doc.setTextColor(...INK);doc.text(L,M+5,y+.5);y+=hh+4},
  h(t){api.ensure(16);doc.setFont("helvetica","bold");doc.setFontSize(12.5);doc.setTextColor(...ACC);doc.text(t,M,y);y+=6.5},
  p(t){doc.setFont("helvetica","normal");doc.setFontSize(10.5);doc.setTextColor(...INK);const L=doc.splitTextToSize(t,CW);api.ensure(L.length*5);doc.text(L,M,y,{lineHeightFactor:1.35});y+=L.length*5+2.5},
  rows(R,mono){for(const[a,b]of R){api.ensure(7);doc.setFont("helvetica","normal");doc.setFontSize(10.5);doc.setTextColor(...MUT);doc.text(a,M+4,y);doc.setFont(mono?"courier":"helvetica","bold");doc.setTextColor(...INK);doc.text(b,W-M,y,{align:"right"});doc.setDrawColor(221,225,232);doc.setLineWidth(.2);doc.line(M+4,y+2.2,W-M,y+2.2);y+=7}y+=2},
  gap(n){y+=n},
  sign(name){api.ensure(30);y+=16;doc.setDrawColor(...MUT);doc.setLineWidth(.3);const half=(CW-12)/2;doc.line(M,y,M+half,y);doc.line(M+half+12,y,W-M,y);doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(...MUT);doc.text("Ort, Datum",M,y+5);doc.text("Zur Kenntnis genommen"+(name?" – "+name:""),M+half+12,y+5);y+=10},
  footer(t){const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont("helvetica","normal");doc.setFontSize(8.5);doc.setTextColor(...MUT);doc.text(t,M,289);doc.text(`Seite ${i} von ${n}`,W-M,289,{align:"right"})}},
  get y(){return y},set y(v){y=v}};
 return api;
}
function sharePdf(doc,name){
 const blob=doc.output("blob");let file;try{file=new File([blob],name,{type:"application/pdf"})}catch(e){file=null}
 if(file&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:name}).catch(e=>{if(e&&e.name!=="AbortError")toast("Teilen hat nicht geklappt. Bitte noch einmal tippen.")});return}
 if(S.framed){toast("In der Vorschau geht das nicht – auf dem iPad öffnet sich das Teilen-Menü (Drucken, Mail, AirDrop).");return}
 const url=URL.createObjectURL(blob);const w=window.open(url,"_blank");if(!w)location.href=url;setTimeout(()=>URL.revokeObjectURL(url),60000);
}

/* ================= Jahresstatistik ================= */
function paidAmount(s,m){const v=(s.paid||{})[m];if(!v||v==="x")return 0;return typeof v==="number"?v:(+s.price||0)}
function yearStats(y){return cached("ys"+y,()=>{
 const Y=String(y),months=[...Array(12)].map((_,i)=>`${Y}-${pad(i+1)}`);
 const inc={durch:Array(12).fill(0),karten:Array(12).fill(0),einzeln:Array(12).fill(0)},held=Array(12).fill(0);
 const all=Object.values(D.students);
 for(const s of all){months.forEach((m,i)=>{if(s.billing==="durch"||(s.paid&&s.paid[m]))inc.durch[i]+=paidAmount(s,m)});
  for(const c of s.cards||[])if(c.paid&&(c.bought||"").startsWith(Y))inc.karten[+c.bought.slice(5,7)-1]+=(+c.price||0)}
 const L=Object.values(D.lessons).filter(l=>l.date&&l.date.startsWith(Y)&&D.students[l.sid]);
 const H=L.filter(l=>l.status==="gehalten"),A=L.filter(l=>l.status==="abgesagt");
 for(const l of H){held[+l.date.slice(5,7)-1]++;const s=D.students[l.sid];if(s.billing==="einzeln"&&l.paid)inc.einzeln[+l.date.slice(5,7)-1]+=(+s.price||0)}
 const byBill={};for(const l of H){const b=D.students[l.sid].billing;byBill[b]=(byBill[b]||0)+1}
 const minutes=H.reduce((a,l)=>a+(+l.dur||+D.students[l.sid].dur||0),0);
 const sids=new Set(H.map(l=>l.sid));
 const neu=all.filter(s=>s.start&&s.start.startsWith(Y)&&s.status!=="warteliste").length;
 const ende=all.filter(s=>s.archivedAt&&s.archivedAt.startsWith(Y)).length;
 const total=[...inc.durch,...inc.karten,...inc.einzeln].reduce((a,b)=>a+b,0);
 const perMonth=months.map((_,i)=>inc.durch[i]+inc.karten[i]+inc.einzeln[i]);
 const groups=new Set(H.filter(l=>D.students[l.sid].kind==="gruppe").map(l=>l.sid)).size;
 return{y,months,inc,held,H,A,byBill,minutes,students:sids.size,neu,ende,total,perMonth,groups,
  cancS:A.filter(l=>l.by==="schueler").length,cancI:A.filter(l=>l.by==="ich").length,nach:H.filter(l=>l.kind==="nachhol").length};
})}

 openSheet(`${sheetHead(isNew?"Neuer Termin":"Termin bearbeiten")}
  <form id="ef" novalidate style="display:flex;flex-direction:column;gap:16px">
  <div class="field"><label for="e_t">Titel</label><input class="inp" id="e_t" name="title" value="${h(ev.title)}" placeholder="z. B. Schülerkonzert im Advent" autocomplete="off"></div>
  <div class="field"><span class="lbl">Art</span>${seg("type",[["konzert","Konzert"],["probe","Probe"],["vorspiel","Vorspiel"],["musikschule","Musikschule"],["sonstiges","Sonstiges"]],ev.type)}</div>
  <div class="two"><div class="field"><label for="e_d">Datum</label><input class="inp" id="e_d" type="date" name="date" value="${h(ev.date)}"></div><div class="field"><label for="e_ti">Uhrzeit</label><input class="inp" id="e_ti" type="time" name="time" value="${h(ev.time||"")}"></div></div>
  <div class="field" style="margin-top:-6px"><div id="eextra" style="display:flex;flex-direction:column;gap:8px"></div><div><button type="button" class="btn sm" data-sact="addRow">${icon("plus")} Weiteres Datum${isNew?"":" (als neuer Termin)"}</button></div><p class="hint" id="eexhint" hidden>Für jedes weitere Datum wird ein eigener Termin mit gleichem Titel, Ort, Mitwirkenden und Notizen angelegt. Danach kannst du jeden einzeln ändern.</p></div>
  <div class="field"><label for="e_p">Ort</label><input class="inp" id="e_p" name="place" value="${h(ev.place||"")}" autocomplete="off"></div>
  <div class="field"><span class="lbl">Wer singt mit?</span>${L.length?`<div class="plist">${L.map(s=>`<label class="cbline"><input type="checkbox" name="p_${h(s.id)}" ${(ev.sids||[]).includes(s.id)?"checked":""}> ${h(s.name)}</label>`).join("")}</div>`:`<p class="hint">Noch keine aktiven Schüler.</p>`}</div>
  <div class="field"><label for="e_n">Notizen</label><textarea class="inp" id="e_n" name="note" placeholder="Programm, Probe, Mitbringen …">${h(ev.note||"")}</textarea></div>
  <div class="foot">${isNew?"":`<button type="button" class="btn danger" data-sact="del">${icon("trash")} Löschen</button>`}<div class="r"><button type="button" class="btn" data-sact="close">Abbrechen</button><button type="submit" class="btn primary">Speichern</button></div></div></form>`,p=>{
  const f=$("#ef",p);
  p.onclick=e=>{const b=e.target.closest("[data-sact]");if(!b)return;if(b.dataset.sact==="close")closeSheet();
   if(b.dataset.sact==="addRow"){const rows=$$(".apptrow",p);const ld=rows.length?$('[data-k="d"]',rows[rows.length-1]).value:$("#e_d",p).value;const lt=rows.length?$('[data-k="t"]',rows[rows.length-1]).value:$("#e_ti",p).value;$("#eextra",p).insertAdjacentHTML("beforeend",apptRow(ld?addDays(ld,7):"",lt||""));$("#eexhint",p).hidden=false}
   if(b.dataset.sact==="delRow")b.closest(".apptrow").remove();
   if(b.dataset.sact==="del")confirmSheet("Termin löschen?",`„${h(ev.title||EVT[ev.type])}“ wird entfernt.`,"Löschen",()=>{delete D.events[ev.id];changed()})};
  f.onsubmit=e=>{e.preventDefault();const v=formVals(f);if(!v.date){toast("Bitte ein Datum eintragen.");return}
   ev.title=v.title.trim()||EVT[v.type];ev.type=v.type;ev.date=v.date;ev.time=v.time;ev.place=v.place.trim();ev.note=v.note.trim();ev.sids=Object.keys(v).filter(k=>k.startsWith("p_")&&v[k]).map(k=>k.slice(2));
   const R=$$(".apptrow",p).map(r=>({d:$('[data-k="d"]',r).value,t:$('[data-k="t"]',r).value})).filter(r=>r.d);
   D.events[ev.id]=ev;for(const r of R){const c=JSON.parse(JSON.stringify(ev));c.id=newId();c.date=r.d;c.time=r.t||"";D.events[c.id]=c}
   changed();closeSheet();toast(R.length?`${R.length+1} Termine gespeichert.`:"Gespeichert.")};
 });
}

/* ================= Sicherung ================= */
async function exportBackup(){
 saveNow();
 const name=`Schuelerbuch-Sicherung-${todayStr()}.json`;
 const json=JSON.stringify({app:"schuelerbuch",version:1,exported:new Date().toISOString(),data:D});
 let file;try{file=new File([json],name,{type:"application/json"})}catch(e){file=null}
 try{
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});markBackup();return}
 }catch(e){if(e&&e.name==="AbortError"){toast("Sicherung abgebrochen.");return}if(S.standalone){toast("Sichern hat nicht geklappt. Bitte noch einmal tippen.");return}}
 if(S.standalone){toast("Dieses Gerät kann die Sicherung nicht teilen.");return}
 try{
  const url=URL.createObjectURL(file||new Blob([json],{type:"application/json"}));const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),8000);
  if(S.framed){toast("In der Vorschau ist Sichern nicht möglich – auf dem iPad dann schon.");return}
  markBackup();
 }catch(e){toast("Sichern hat hier nicht geklappt.")}
}
function markBackup(){D.meta.lastBackup=todayStr();changed();toast("Sicherung erstellt.")}
$("#importFile").addEventListener("change",async e=>{
 const file=e.target.files&&e.target.files[0];e.target.value="";if(!file)return;
 let obj;try{obj=JSON.parse(await file.text())}catch(err){toast("Diese Datei ist keine Schülerbuch-Sicherung.");return}
 if(!obj||obj.app!=="schuelerbuch"||!obj.data){toast("Diese Datei ist keine Schülerbuch-Sicherung.");return}
 const n=Object.keys(obj.data.students||{}).length;
 confirmSheet("Sicherung einspielen?",`Die Sicherung vom <b>${fmtD(String(obj.exported||"").slice(0,10))}</b> enthält <b>${n} Schüler</b>. Alle Daten, die jetzt in der App sind, werden dadurch <b>ersetzt</b>.`,"Einspielen",async()=>{
  try{await Store.set("state_before_import",JSON.parse(JSON.stringify(D)))}catch(e){}
  D=normalize(obj.data);heldSeen=null;syncCards();changed();await saveNow();toast("Sicherung eingespielt.");go("home");
 });
});

/* ================= Beispieldaten ================= */
function loadSample(){
 const t=todayStr();const start=addDays(mondayOf(t),-28);
 const mk=(name,o)=>{const s=Object.assign(blankStudent(),{name:"Beispiel: "+name,example:true,start},o);s.slots=(o.slots||[]).map(x=>Object.assign({id:newId(),rh:"1",from:start},x));D.students[s.id]=s;return s};
 const a=mk("Anna Berger",{billing:"durch",dur:45,price:95,slots:[{wd:2,time:"16:00"}],notes:"Mezzosopran. Ziel: Aufnahmeprüfung Musical im Frühjahr."});
 const b=mk("Ben Kraus",{billing:"zehner",dur:45,slots:[{wd:3,time:"17:00"}]});
 const c=mk("Clara Hofmann",{billing:"durch",dur:60,price:125,slots:[{wd:4,time:"18:00",rh:"2"}]});
 const d=mk("David Neumann",{billing:"ms",dur:45,slots:[{wd:1,time:"15:30"}]});
 const e=mk("Emma Schulz",{billing:"zehner",dur:45,slots:[{wd:5,time:"10:30"}]});
 mk("Felix Wagner",{status:"warteliste",waitSince:addDays(t,-20),waitWish:"Mo oder Mi ab 17 Uhr",slots:[]});
 mk("Greta Lorenz",{status:"archiviert",archivedAt:addDays(t,-60),billing:"durch",dur:45,price:90,slots:[]});
 b.cards=[{id:newId(),size:5,bought:start,price:210,paid:true,uses:[]}];
 e.cards=[{id:newId(),size:10,bought:addDays(start,-21),price:380,paid:false,uses:[...Array(5)].map(()=>({date:null,lid:null}))}];
 mk("Hanna Roth",{billing:"einzeln",dur:45,price:45,slots:[{wd:3,time:"18:30",rh:"2"}]});
 a.paid={[ym(addDays(t,-31))]:true};c.paid={[ym(addDays(t,-31))]:true,[ym(t)]:true};
 ver++;
 const notes=["Atemübungen, Lippenflattern, Stück ab Takt 17","Registerwechsel geübt, Lied auswendig bis Strophe 2","Neues Stück angefangen, Text sprechen","Aufnahme gemacht, Intonation in der Höhe"];
 let i=0;
 for(let k=28;k>=1;k--){const day=addDays(t,-k);for(const l of lessonsOn(day)){const st=D.students[l.sid];if(!st||!st.example)continue;
  if(k<=3)continue;
  if(st===c&&k>14&&k<=21){saveLessonRaw(Object.assign({},l,{status:"abgesagt",by:"ich",nachholen:true,example:true}));continue}
  saveLessonRaw(Object.assign({},l,{status:"gehalten",note:notes[i++%notes.length],paid:st.billing==="einzeln"&&k>10,example:true}))}}
 const r1={id:newId(),sid:a.id,text:"Noten „Defying Gravity“ in Es-Dur ausdrucken",done:false,created:t,example:true};
 const r2={id:newId(),sid:e.id,text:"Playback für das Vorspiel aufnehmen",done:false,created:t,example:true};
 D.reminders[r1.id]=r1;D.reminders[r2.id]=r2;
 const ev1={id:newId(),title:"Adventskonzert meiner Schüler",type:"konzert",date:addDays(t,27),time:"17:00",place:"Gemeindesaal",sids:[a.id,c.id,e.id],note:"Probe eine Woche vorher",example:true};
 const ev2={id:newId(),title:"Vorspiel der Musikschule",type:"musikschule",date:addDays(t,12),time:"18:00",place:"Musikschule, Saal",sids:[d.id],note:"",example:true};
 D.events[ev1.id]=ev1;D.events[ev2.id]=ev2;
 changed();toast("Beispielschüler geladen.");
}
function saveLessonRaw(l){const c=cleanLesson(l);c.example=true;D.lessons[c.id]=c;ver++}
function removeSample(){
 const ids=new Set(Object.values(D.students).filter(s=>s.example).map(s=>s.id));
 for(const id of ids)delete D.students[id];
 for(const [k,l] of Object.entries(D.lessons))if(l.example||ids.has(l.sid))delete D.lessons[k];
 for(const [k,r] of Object.entries(D.reminders))if(r.example||ids.has(r.sid))delete D.reminders[k];
 for(const [k,e] of Object.entries(D.events))if(e.example)delete D.events[k];
 changed();toast("Beispielschüler entfernt.");
}

/* ================= Aktionen ================= */
const ACT={
 nav:d=>go(d.view),
 student:d=>go("student",d.id),
 back:()=>go(S.from&&S.from!=="student"?S.from:"students"),
 punch:d=>quickStamp(d.sid,d.cid),slot:d=>openStamp(d.sid,d.cid,+d.i),diarySearch:d=>{S.dq=d.q||"";S.dqSid=d.sid;render()},weekPrev:()=>{S.week=addDays(S.week,-7);render()},weekNext:()=>{S.week=addDays(S.week,7);render()},weekToday:()=>{S.week=mondayOf(todayStr());render()},
 payPrev:()=>{S.payMonth=addMonths(S.payMonth,-1);render()},payNext:()=>{S.payMonth=addMonths(S.payMonth,1);render()},
 lesson:d=>openLesson(d.id),
 held:d=>markHeld(d.id),
 cancel:d=>openLesson(d.id,{status:"abgesagt"}),
 addAppt:d=>openAppt(d.date||todayStr(),d.sid),
 newStudent:()=>openStudentForm(),
 editStudent:d=>openStudentForm(d.id),
 takeIn:d=>openStudentForm(d.id,{status:"aktiv",start:todayStr()}),
 filter:d=>{S.filter=d.f;S.search="";render()},
 filterGo:d=>{S.filter=d.f;S.search="";go("students")},
 newCard:d=>openCard(d.sid),editCard:d=>openCard(d.sid,d.cid),
 cardPaid:d=>{const st=D.students[d.sid];const c=st&&(st.cards||[]).find(x=>x.id===d.cid);if(c){c.paid=!c.paid;changed()}},
 allHeld:()=>confirmSheet("Alle als gehalten abhaken?",`${pastOpen().length} vergangene Stunden werden als <b>gehalten</b> markiert. Bei Zehnerkarten wird jeweils eine Stunde abgezogen. Abgesagte Stunden vorher bitte einzeln als abgesagt markieren.`,"Alle abhaken",()=>{for(const l of pastOpen())D.lessons[l.id]=cleanLesson(Object.assign({},l,{status:"gehalten"}));changed();toast("Erledigt.")},false),
 strike:d=>{const st=D.settings.struck;if(st[d.d])delete st[d.d];else st[d.d]=true;changed()},
 yearPrev:()=>{S.planYear--;render()},yearNext:()=>{S.planYear++;render()},
 autoPlan:()=>autoPlan(),
 resetYear:()=>confirmSheet(`Streichungen ${S.planYear} zurücksetzen?`,"Alle gestrichenen Tage dieses Jahres werden wieder zu Unterrichtstagen.","Zurücksetzen",()=>{for(const d of Object.keys(D.settings.struck))if(d.startsWith(String(S.planYear)))delete D.settings.struck[d];changed()}),
 termsPdf:()=>termsPdf(),freeDaysPdf:()=>freeDaysPdf(),
 reactivate:d=>{const s=D.students[d.id];if(!s)return;if(s.pauseFrom)s.pauses=(s.pauses||[]).concat([{from:s.pauseFrom,to:todayStr()}]);delete s.pauseFrom;s.status="aktiv";delete s.pauseUntil;delete s.pauseNote;changed();toast(`${s.name} ist wieder aktiv.`)},
 statPrev:()=>{S.statYear--;render()},statNext:()=>{S.statYear++;render()},statsPdf:()=>statsPdf(),
 lessonPaid:d=>{const l=D.lessons[d.id];if(l){l.paid=!l.paid;changed()}},
 monthCycle:d=>{const st=D.students[d.sid];if(!st)return;st.paid=st.paid||{};const v=st.paid[d.m];if(v==="x")delete st.paid[d.m];else if(v)st.paid[d.m]="x";else st.paid[d.m]=st.price!=null?+st.price:true;changed()},
 monthPaid:d=>{const st=D.students[d.sid];if(!st)return;st.paid=st.paid||{};if(st.paid[d.m])delete st.paid[d.m];else st.paid[d.m]=st.price!=null?+st.price:true;changed()},
 remToggle:d=>{const r=D.reminders[d.id];if(r){r.done=!r.done;r.doneAt=r.done?todayStr():null;changed();if(r.done)toast("Erledigt.","Rückgängig",()=>{r.done=false;r.doneAt=null;changed()})}},
 remDel:d=>{const r=D.reminders[d.id];if(!r)return;delete D.reminders[d.id];changed();toast("Erinnerung gelöscht.","Rückgängig",()=>{D.reminders[r.id]=r;changed()})},
 addRem:d=>openReminder(d.sid||null),
 newEvent:d=>openEvent(null,d.type,d.date),event:d=>openEvent(d.id),
 histAll:()=>{S.histAll=true;render()},pastEv:()=>{S.showPastEv=true;render()},
 backup:()=>exportBackup(),import:()=>$("#importFile").click(),
 sample:()=>loadSample(),removeSample:()=>confirmSheet("Beispielschüler entfernen?","Alle mit „Beispiel:“ markierten Schüler und ihre Stunden, Erinnerungen und Termine werden entfernt. Deine echten Schüler bleiben.","Entfernen",removeSample),
 freeAdd:()=>{D.settings.free.push({id:newId(),name:"Urlaub",from:todayStr(),to:todayStr()});changed()},
 freeDel:d=>{D.settings.free=D.settings.free.filter(f=>f.id!==d.id);changed()}
};
document.addEventListener("click",e=>{
 if(e.target.closest("#sheet"))return;
 const el=e.target.closest("[data-act]");if(!el)return;const fn=ACT[el.dataset.act];if(!fn)return;e.preventDefault();fn(el.dataset,el,e);
});
$("#main").addEventListener("input",e=>{if(e.target.id==="search"){S.search=e.target.value;$("#slist").innerHTML=studentList()}
 else if(e.target.dataset.diaryq){S.dq=e.target.value;S.dqSid=e.target.dataset.diaryq;clearTimeout(S.dqT);S.dqT=setTimeout(()=>{const st=D.students[S.dqSid];const box=e.target.closest(".blk")||null;if(!st)return;const pos=e.target.selectionStart;const hist=(lessonIdx().bySid[st.id]||[]).filter(l=>l.date<=todayStr()&&l.status!=="offen").sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));const wrap=$("#diary");if(!wrap)return;wrap.innerHTML=diaryHtml(st,hist);const inp=$("[data-diaryq]",wrap);inp.focus();try{inp.setSelectionRange(pos,pos)}catch(_){}},200)}});
$("#main").addEventListener("change",e=>{
 const t=e.target;const st=D.settings;
 if(t.hasAttribute("data-weekjump")){if(t.value){S.week=mondayOf(t.value);S.keepScroll=false;t.blur();window.scrollTo(0,0);render()}return}
 if(t.dataset.free){const f=st.free.find(x=>x.id===t.dataset.free);if(f){f[t.dataset.field]=t.value;changed()}}
 else if(t.dataset.price){st.prices[t.dataset.price]=t.value.split(/[;,]\s*|\s+/).map(num).filter(x=>x!=null);changed()}
 else if(t.dataset.cardprice){st.cardPrice[t.dataset.cardprice]=num(t.value);changed()}
 else if(t.hasAttribute("data-singleprice")){st.singlePrice=num(t.value);changed()}
 else if(t.hasAttribute("data-termsfor")){S.termsFor=t.value;t.blur();render()}
 else if(t.dataset.prof){D.settings.profile[t.dataset.prof]=t.value.trim();changed()}
 else if(t.hasAttribute("data-target")){D.settings.yearTarget=Math.max(1,+t.value||36);changed()}
 else if(t.hasAttribute("data-warn")){st.warn=Math.max(0,+t.value||0);changed()}
 else if(t.dataset.day){const d=+t.dataset.day;st.days=t.checked?[...new Set([...st.days,d])].sort():st.days.filter(x=>x!==d);changed()}
});

/* ================= Start ================= */
(async function init(){
 await Store.open();
 let loaded;try{loaded=await Store.get("state")}catch(e){loaded=null}
 D=normalize(loaded);heldSeen=null;syncCards();S.planYear=defaultPlanYear();
 if(loaded){try{const lastCopy=await Store.get("copyDay");if(lastCopy!==todayStr()){await Store.set("state_prev",loaded);await Store.set("copyDay",todayStr())}}catch(e){}}
 try{if(navigator.storage&&navigator.storage.persist&&!S.framed){S.persisted=await navigator.storage.persist()}}catch(e){}
 S.ready=true;ver++;render();
 if("serviceWorker" in navigator&&location.protocol==="https:"&&!S.framed){navigator.serviceWorker.register("sw.js").catch(()=>{})}
 // Datum aktuell halten, wenn die App über Nacht offen bleibt
 let day=todayStr();setInterval(()=>{if(todayStr()!==day){day=todayStr();S.week=mondayOf(day);ver++;render()}},60000);
})();
</script>
